[package]
name = "football-oracle"
version = "0.1.0"
description = "Event-sourced football (soccer) oracle for the Internet Computer with ICRC-3 integration"
repository = "https://github.com/soccer-oracle"
keywords = [
  "oracle",
  "football",
  "soccer",
  "icrc3",
  "sports-data",
  "event-sourcing"
]

[dependencies]
base = "0.14.14"
ovs-fixed = "0.1.4"
class-plus = "0.0.2"
timer-tool = "0.1.1"
star = "0.1.1"
map = "9.0.1"
icrc10-mo = "0.0.1"
stable-local-log = "0.1.1"
candy = "0.3.1"
icrc3-mo = "0.3.0"
sha2 = "0.1.6"
stableheapbtreemap = "1.5.0"
ic-certification = "0.1.0"
json = "1.4.0"
xtended-numbers = "0.4.0"
ic = "3.2.0"

[toolchain]
moc = "0.14.14"

[dev-dependencies]
test = "2.1.1"
bench = "1.0.0"
